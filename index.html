
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chatbot-popup">

        <div class="chat-header">
            <div class="header-info">
                <span class="chatbot-logo material-symbols-rounded">smart_toy</span>
                <h2 class="logo-text">Chatbot</h2>
            </div>

            <button id="close-chatbot" class="material-symbols-rounded" type="button" aria-label="Minimize chatbot">
                keyboard_arrow_down
            </button>
        </div>

        <div class="chat-body">
            <div class="message bot-message">
                <span class="bot-avatar material-symbols-rounded">smart_toy</span>
                <div class="message-text">
                    Hey there 👋 <br>
                    How can I help you today?
                </div>
            </div>
        </div>

        <div class="chat-footer">
            <form action="#" class="chat-form">

                <textarea
                    placeholder="Message..."
                    class="message-input"
                    required></textarea>

                <div class="chat-controls">

                    <button type="button" id="emoji-picker" class="material-symbols-rounded" aria-label="Add emoji">
                        sentiment_satisfied
                    </button>

                    <div class="file-upload-wrapper">
                        <input type="file" accept="image/*" id="file-input" hidden>

                        <img src="" alt="Selected image" class="attachment-preview">

                        <button type="button" id="file-upload" class="material-symbols-rounded" aria-label="Attach image">
                            attach_file
                        </button>

                        <button type="button" id="file-cancel" class="material-symbols-rounded" aria-label="Remove attachment">
                            close
                        </button>
                    </div>

                    <button type="submit" id="send-message" class="material-symbols-rounded" aria-label="Send message">
                        arrow_upward
                    </button>

                </div>
            </form>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
